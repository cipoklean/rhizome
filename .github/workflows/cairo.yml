name: cairo

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/cairo.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Set up Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.18.0"

      - name: Set up Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.63.0"

      - name: Versions
        run: |
          scarb --version
          snforge --version

      - name: Build
        run: scarb build

      - name: Test
        run: |
          set -o pipefail
          snforge test | tee /tmp/snforge.log
          passed=$(grep -oE 'Tests: [0-9]+ passed' /tmp/snforge.log | head -1 | grep -oE '[0-9]+' | head -1)
          failed=$(grep -oE '[0-9]+ failed' /tmp/snforge.log | head -1 | grep -oE '[0-9]+' | head -1)
          echo "parsed: passed=${passed:-0} failed=${failed:-unknown}"
          echo "### Cairo tests: ${passed:-0} passed" >> "$GITHUB_STEP_SUMMARY"
          if [ "${passed:-0}" -lt 6 ]; then
            echo "::error::expected at least 6 passing tests, parsed ${passed:-0}"
            exit 1
          fi
          if [ "${failed:-0}" -ne 0 ]; then
            echo "::error::${failed} test(s) failed"
            exit 1
          fi

      - name: Format check
        continue-on-error: true
        run: scarb fmt --check

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhizome-anonymizer-artifacts
          path: contracts/target/dev/*.json
          if-no-files-found: error

      # There is no local Cairo toolchain on this project's dev machine (see
      # README), so the compiled class is published into the repo. That makes the
      # exact deployed bytecode reviewable, and lets deployment run from
      # starknet.js without Scarb.
      #
      # MockVesuVault ships alongside it for one reason: Vesu has no Sepolia
      # deployment, so rehearsing the vault leg on testnet needs a venue, and a
      # 1:1 vault the snforge suite already exercises is the honest stand-in. It
      # is a test double and is never referenced by mainnet config.
      - name: Publish compiled classes to repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        run: |
          mkdir -p artifacts
          for c in RhizomeVesuAnonymizer MockVesuVault; do
            cp "contracts/target/dev/rhizome_anonymizer_${c}.contract_class.json" artifacts/
            cp "contracts/target/dev/rhizome_anonymizer_${c}.compiled_contract_class.json" artifacts/
          done
          cp contracts/target/dev/rhizome_anonymizer.starknet_artifacts.json artifacts/
          git add artifacts
          if git diff --cached --quiet -- artifacts; then
            echo "artifacts unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: publish compiled classes [skip ci]"
          git push
